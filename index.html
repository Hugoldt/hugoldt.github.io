<style>
/* Layout : rendu 3D plein écran façon photo ; HUD discret ; « bureau de l'ordi » en plein écran quand on entre dans l'écran. Look unique sombre. */
:root{
  --bg:#0E0E0F;
  --fg:#F3F1EC;
  --muted:rgba(243,241,236,.62);
  --line:rgba(243,241,236,.18);
  --accent:#E9C46A;
  --os-bg:#EDEBE6;
  --os-fg:#1C1B1A;
  --os-line:rgba(28,27,26,.12);
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;padding-left:max(16px,var(--sl));padding-right:max(16px,var(--sr));-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}

.hud{position:fixed;z-index:4;transition:opacity .5s}
body.focus .hud,body.focus #spots{opacity:0;pointer-events:none}
.brand{top:calc(20px + var(--st));left:calc(22px + var(--sl));text-shadow:0 1px 12px rgba(0,0,0,.5)}
.brand b{display:block;font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand span{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px}
.tools{top:calc(18px + var(--st));right:calc(20px + var(--sr));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-family:var(--mono);font-size:11.5px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(14,14,15,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill:hover{border-color:var(--accent)}
.help{left:50%;bottom:calc(22px + var(--sb));transform:translateX(-50%);font-size:13px;padding:10px 16px;border-radius:999px;background:rgba(14,14,15,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);white-space:nowrap}
.help b{color:var(--accent);font-weight:600}
.help .sep{opacity:.4;margin:0 4px}
.help button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--fg)}
.help button:hover{color:var(--accent)}
.help button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#spots{position:fixed;inset:0;z-index:3;pointer-events:none;transition:opacity .4s}
.spot{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:8px;background:none;border:none;padding:0}
.spot i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 4px rgba(255,255,255,.22),0 2px 10px rgba(0,0,0,.4);flex:none;animation:breathe 2.4s ease-in-out infinite}
.spot span{font-size:12px;font-weight:600;background:rgba(14,14,15,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .2s}
.spot:hover span,.spot:focus-visible span,.spot.hot span,body.coarse .spot span{opacity:1;transform:none}
@keyframes breathe{50%{box-shadow:0 0 0 9px rgba(255,255,255,0),0 2px 10px rgba(0,0,0,.4)}}

.card{position:fixed;z-index:8;right:calc(18px + var(--sr));top:50%;width:min(380px,calc(100vw - 36px));max-height:calc(100vh - 36px);overflow:auto;transform:translate(calc(100% + 40px),-50%);transition:transform .55s cubic-bezier(.2,.9,.25,1);background:rgba(20,20,21,.78);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:18px;padding:22px}
.card.open{transform:translate(0,-50%)}
.card small{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.card h2{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:8px 0 14px}
.card p{margin:0 0 12px;font-size:15px;line-height:1.55;color:rgba(243,241,236,.86)}
.card dl{margin:0 0 14px;display:grid}
.card dl div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.card dt{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.card dd{margin:0}
.email{font-family:var(--mono);font-size:15px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px}
.b{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:10px;padding:10px 13px;font-size:13.5px;font-weight:600;text-decoration:none;color:var(--fg)}
.b.main{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.b:hover{border-color:var(--accent)}
.card .close{margin-top:14px;width:100%}

/* ---- L'ORDI ---- */
.os{position:fixed;inset:0;z-index:10;background:radial-gradient(120% 90% at 20% 10%,#F7D9B5 0%,#E5A57E 30%,#8B6E9E 62%,#2E3256 100%);color:var(--os-fg);opacity:0;pointer-events:none;transition:opacity .45s;display:flex;flex-direction:column}
.os.open{opacity:1;pointer-events:auto}
.menubar{height:calc(30px + var(--st));padding:var(--st) max(14px,var(--sr)) 0 max(14px,var(--sl));display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.42);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:13px;font-weight:500}
.menubar b{font-weight:700}
.menubar .sp{flex:1}
.menubar button{background:none;border:none;font-size:13px;font-weight:600;padding:4px 8px;border-radius:6px}
.menubar button:hover{background:rgba(0,0,0,.08)}
.desk{flex:1;display:grid;place-items:center;padding:20px max(16px,var(--sr)) calc(20px + var(--sb)) max(16px,var(--sl));min-height:0}
.win{width:min(1040px,100%);height:min(680px,100%);background:var(--os-bg);border-radius:14px;box-shadow:0 30px 80px rgba(20,10,40,.45),0 0 0 1px rgba(0,0,0,.08);display:grid;grid-template-rows:auto 1fr;overflow:hidden;animation:winIn .55s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes winIn{from{transform:scale(.92) translateY(18px);opacity:0}}
.titlebar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--os-line);font-size:12.5px;color:rgba(28,27,26,.6)}
.titlebar i{width:12px;height:12px;border-radius:50%;background:#D9D5CE}
.titlebar i:first-child{background:#E56B5D}.titlebar i:nth-child(2){background:#E9C46A}.titlebar i:nth-child(3){background:#7CB97A}
.titlebar span{margin-left:10px;font-family:var(--mono)}
.wbody{display:grid;grid-template-columns:200px 1fr;min-height:0}
.side{border-right:1px solid var(--os-line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:rgba(28,27,26,.03)}
.side button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-size:14px;font-weight:500;display:flex;justify-content:space-between}
.side button:hover{background:rgba(28,27,26,.06)}
.side button[aria-current="true"]{background:var(--os-fg);color:var(--os-bg)}
.side button:focus-visible{outline:2px solid #2B6CB0;outline-offset:1px}
.side small{font-family:var(--mono);font-size:11px;opacity:.55}
.main{overflow:auto;padding:30px clamp(18px,3vw,40px)}
.main h1{font-size:clamp(34px,5vw,58px);font-weight:800;letter-spacing:-.035em;line-height:.95;margin:0 0 12px;text-wrap:balance}
.main .lead{font-size:17px;line-height:1.5;max-width:56ch;color:rgba(28,27,26,.75);margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.proj{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;border-radius:12px;transition:transform .25s}
.proj:hover{transform:translateY(-3px)}
.proj:focus-visible{outline:2px solid #2B6CB0;outline-offset:3px}
.thumb{aspect-ratio:4/3;border-radius:10px;background:var(--g);position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.06) inset}
.thumb b{position:absolute;left:12px;bottom:10px;font-size:22px;font-weight:800;letter-spacing:-.03em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.proj strong{font-size:15px}
.proj span{font-size:13px;color:rgba(28,27,26,.6)}
.detail .hero{aspect-ratio:16/7;border-radius:14px;background:var(--g);margin-bottom:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.tags span{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(28,27,26,.07)}
.osb{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--os-line);background:#fff;color:var(--os-fg)}
.osb.dark{background:var(--os-fg);color:var(--os-bg);border-color:var(--os-fg)}
.osrow{display:flex;flex-wrap:wrap;gap:8px}
.skill{display:grid;grid-template-columns:150px 1fr 40px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--os-line);font-size:15px}
.skill .bar{height:6px;border-radius:3px;background:rgba(28,27,26,.1);overflow:hidden}
.skill .bar i{display:block;height:100%;width:var(--v);background:var(--os-fg)}
.skill b{font-family:var(--mono);font-size:12px;text-align:right;font-weight:500}
.osmail{font-family:var(--mono);font-size:clamp(16px,2.6vw,22px);padding:14px 16px;border-radius:12px;background:#fff;border:1px solid var(--os-line);margin:0 0 12px;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.cvhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.cvmeta{font-family:var(--mono);font-size:12px;color:rgba(28,27,26,.6);margin:0}
.cvsec{margin:0 0 26px}
.cvsec h3{font-family:var(--mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:rgba(28,27,26,.55);margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--os-line)}
.cvp{font-size:15px;line-height:1.6;margin:0;max-width:70ch}
.cvitem{margin:0 0 16px}
.cvitem .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700;font-size:16px}
.cvitem .top span{font-family:var(--mono);font-size:12px;font-weight:500;color:rgba(28,27,26,.55)}
.cvitem .org{font-size:14px;color:rgba(28,27,26,.6);margin:2px 0 6px}
.cvitem ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.55;display:grid;gap:4px}
.cvlink{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.cvlink:focus-visible{outline:2px solid #2B6CB0;outline-offset:2px}
.chat{display:flex;flex-direction:column;gap:14px;max-width:760px}
.chat .lead{margin-bottom:4px}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--os-fg);color:var(--os-bg);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--os-line);border-bottom-left-radius:5px}
.msg.wait{color:rgba(28,27,26,.5);font-style:italic}
.sugg{display:flex;flex-wrap:wrap;gap:7px}
.sugg button{all:unset;cursor:pointer;font-size:13.5px;padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--os-line)}
.sugg button:hover{background:var(--os-fg);color:var(--os-bg)}
.sugg button:focus-visible{outline:2px solid #2B6CB0;outline-offset:2px}
.ask{display:flex;gap:8px;position:sticky;bottom:-30px;background:var(--os-bg);padding:10px 0 4px}
.ask input{flex:1;min-width:0;font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;border:1px solid var(--os-line);background:#fff;color:var(--os-fg)}
.ask input:focus{outline:2px solid #2B6CB0;outline-offset:1px}
.ask button[disabled]{opacity:.5}
.asknote{font-size:14px;color:rgba(28,27,26,.7);margin:0}
@media (max-width:720px){
  .wbody{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--os-line);padding:8px}
  .side button{white-space:nowrap}.side small{display:none}
  .help{white-space:normal;width:calc(100vw - 40px);text-align:center}
  .skill{grid-template-columns:1fr 40px}.skill .bar{grid-column:1/-1;grid-row:2}
}

.intro{position:fixed;inset:0;z-index:12;background:#000;display:grid;place-items:center;text-align:center;transition:opacity 1.4s;padding:24px}
.intro.gone{opacity:0;pointer-events:none}
.intro p{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:0}
.toast{position:fixed;z-index:30;left:50%;top:calc(18px + var(--st));transform:translate(-50%,-200%);background:rgba(20,20,21,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;transition:transform .35s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.spot i{animation:none}.win{animation:none}.card{transition:none}}

html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>

function projectArt(kind){
  const W = 960, H = 720, c = cnv(W, H), g = c.getContext('2d');
  if (kind === 'block') {
    const bg = g.createRadialGradient(W*.5, H*.45, 40, W*.5, H*.5, W*.75); bg.addColorStop(0,'#3A2E9E'); bg.addColorStop(1,'#0B0920'); g.fillStyle = bg; g.fillRect(0,0,W,H);
    g.strokeStyle = 'rgba(160,150,255,.12)'; g.lineWidth = 1; for (let x=0;x<W;x+=40){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); } for (let y=0;y<H;y+=40){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
    const face = (pts, col) => { g.beginPath(); pts.forEach(([a,b],i) => i ? g.lineTo(a,b) : g.moveTo(a,b)); g.closePath(); g.fillStyle = col; g.fill(); g.strokeStyle = 'rgba(220,215,255,.5)'; g.lineWidth = 1.5; g.stroke(); };
    const cube = (x, y, s, a) => {
      face([[x, y-s],[x+s, y-s/2],[x, y],[x-s, y-s/2]], `rgba(190,182,255,${a})`);
      face([[x-s, y-s/2],[x, y],[x, y+s],[x-s, y+s/2]], `rgba(110,93,245,${a})`);
      face([[x+s, y-s/2],[x, y],[x, y+s],[x+s, y+s/2]], `rgba(60,46,170,${a})`); };
    const pts = [[200,460],[340,380],[480,440],[620,360],[760,420]];
    g.strokeStyle = 'rgba(190,182,255,.7)'; g.lineWidth = 4; g.setLineDash([10,10]); g.beginPath(); pts.forEach(([x,y],i) => i ? g.lineTo(x,y) : g.moveTo(x,y)); g.stroke(); g.setLineDash([]);
    pts.forEach(([x,y],i) => cube(x, y, 52, i === 2 ? 1 : .85));
    const bx = 480, by = 230; const glow = g.createRadialGradient(bx,by,0,bx,by,160); glow.addColorStop(0,'rgba(255,214,90,.55)'); glow.addColorStop(1,'rgba(255,214,90,0)'); g.fillStyle = glow; g.fillRect(0,0,W,H);
    const ball = g.createRadialGradient(bx-22, by-26, 6, bx, by, 72); ball.addColorStop(0,'#FFF4C9'); ball.addColorStop(.5,'#FFC93C'); ball.addColorStop(1,'#B9790D'); g.fillStyle = ball; g.beginPath(); g.arc(bx, by, 70, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(bx, by, 38, 0, 7); g.fill();
    g.fillStyle = '#231C66'; g.font = '800 40px "Inter Tight", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('7', bx, by+2);
    g.fillStyle = 'rgba(255,255,255,.85)'; g.font = '500 22px "JetBrains Mono", monospace'; g.textAlign = 'left'; g.fillText('Chainlink VRF · Ethereum Sepolia', 48, H-48);
  } else {
    const bg = g.createLinearGradient(0,0,W,H); bg.addColorStop(0,'#0C2E2A'); bg.addColorStop(1,'#04110F'); g.fillStyle = bg; g.fillRect(0,0,W,H);
    const glow = g.createRadialGradient(W*.5, H*.48, 0, W*.5, H*.48, 360); glow.addColorStop(0,'rgba(80,220,195,.28)'); glow.addColorStop(1,'rgba(80,220,195,0)'); g.fillStyle = glow; g.fillRect(0,0,W,H);
    // squelette de chien stylisé en fil de fer
    const cx = W*.5, cy = H*.5; g.strokeStyle = 'rgba(140,240,220,.9)'; g.lineWidth = 3; g.lineCap = 'round';
    const spine = []; for (let i=0;i<=14;i++){ const t = i/14; spine.push([cx - 250 + t*420, cy - 40 - Math.sin(t*Math.PI)*30]); }
    g.beginPath(); spine.forEach(([x,y],i) => i ? g.lineTo(x,y) : g.moveTo(x,y)); g.stroke();
    spine.forEach(([x,y],i) => { g.beginPath(); g.arc(x, y, 7, 0, 7); g.stroke(); if (i > 3 && i < 11) { g.beginPath(); g.ellipse(x, y + 42, 10, 46, 0, 0, Math.PI); g.stroke(); } });
    g.beginPath(); g.ellipse(cx + 215, cy - 70, 58, 38, -.25, 0, 7); g.stroke(); g.beginPath(); g.moveTo(cx + 250, cy - 60); g.lineTo(cx + 300, cy - 40); g.lineTo(cx + 255, cy - 30); g.stroke();
    [[cx - 200, 1],[cx - 150, -1],[cx + 120, 1],[cx + 160, -1]].forEach(([x,s]) => { g.beginPath(); g.moveTo(x, cy - 30); g.lineTo(x + s*14, cy + 60); g.lineTo(x - s*6, cy + 150); g.lineTo(x + 18, cy + 158); g.stroke(); [[x, cy-30],[x+s*14, cy+60],[x-s*6, cy+150]].forEach(([a,b]) => { g.fillStyle = 'rgba(140,240,220,1)'; g.beginPath(); g.arc(a, b, 5, 0, 7); g.fill(); }); });
    g.beginPath(); g.moveTo(cx - 250, cy - 40); g.quadraticCurveTo(cx - 320, cy - 80, cx - 340, cy - 150); g.stroke();
    g.strokeStyle = 'rgba(140,240,220,.16)'; g.lineWidth = 1; for (let i=0;i<9;i++){ g.beginPath(); g.ellipse(cx, cy + 190, 360 - i*30, 40 - i*3, 0, 0, 7); g.stroke(); }
    g.fillStyle = '#FFC93C'; g.beginPath(); g.roundRect ? g.roundRect(48, 44, 300, 46, 23) : g.rect(48,44,300,46); g.fill();
    g.fillStyle = '#0C2E2A'; g.font = '700 22px "Inter Tight", sans-serif'; g.textBaseline = 'middle'; g.fillText('En cours de développement', 66, 68);
    g.fillStyle = 'rgba(255,255,255,.85)'; g.font = '500 22px "JetBrains Mono", monospace'; g.textBaseline = 'alphabetic'; g.fillText('Visualisation 3D · ostéopathie animale', 48, H-48);
  }
  return c.toDataURL('image/jpeg', .86);
}

function mkNoise(seed){
  const p = new Uint8Array(512); const r = []; let s = seed;
  for (let i=0;i<256;i++) r[i] = i;
  for (let i=255;i>0;i--){ s = (s*16807) % 2147483647; const j = s % (i+1); [r[i], r[j]] = [r[j], r[i]]; }
  for (let i=0;i<512;i++) p[i] = r[i & 255];
  const fade = t => t*t*t*(t*(t*6-15)+10), lerp = (a,b,t) => a + (b-a)*t;
  const grad = (h,x,y) => ((h & 1) ? -x : x) + ((h & 2) ? -y : y);
  return (x,y) => { const X = Math.floor(x) & 255, Y = Math.floor(y) & 255; x -= Math.floor(x); y -= Math.floor(y); const u = fade(x), v = fade(y);
    const a = p[X]+Y, b = p[X+1]+Y; return lerp(lerp(grad(p[a],x,y), grad(p[b],x-1,y), u), lerp(grad(p[a+1],x,y-1), grad(p[b+1],x-1,y-1), u), v); };
}
const n2 = mkNoise(1337);
const fbm = (x,y,o=4) => { let v = 0, a = .5, f = 1; for (let i=0;i<o;i++){ v += a*n2(x*f,y*f); a *= .5; f *= 2; } return v; };
const cnv = (w,h=w) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function toTex(c, srgb=true, rep=[1,1]){ const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }
function normalFrom(h, S, strength){
  const c = cnv(S), g = c.getContext('2d'), img = g.createImageData(S,S);
  for (let y=0;y<S;y++) for (let x=0;x<S;x++){
    const l = h[y*S+((x-1+S)%S)], r = h[y*S+((x+1)%S)], u = h[((y-1+S)%S)*S+x], d = h[((y+1)%S)*S+x];
    let nx = (l - r)*strength, ny = (u - d)*strength, nz = 1; const len = Math.hypot(nx,ny,nz); nx/=len; ny/=len; nz/=len;
    const i = (y*S+x)*4; img.data[i] = (nx*.5+.5)*255; img.data[i+1] = (ny*.5+.5)*255; img.data[i+2] = (nz*.5+.5)*255; img.data[i+3] = 255;
  }
  g.putImageData(img,0,0); return c;
}
function grayCanvas(h, S, fn){ const c = cnv(S), g = c.getContext('2d'), img = g.createImageData(S,S); for (let i=0;i<S*S;i++){ const v = fn(h[i]); img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v; img.data[i*4+3] = 255; } g.putImageData(img,0,0); return c; }

// parquet chêne
function oakFloor(){
  const S = 1024, H = new Float32Array(S*S), c = cnv(S), g = c.getContext('2d'), img = g.createImageData(S,S);
  const rows = 6, pw = S/rows; const plankLen = S/1.5;
  for (let y=0;y<S;y++) for (let x=0;x<S;x++){
    const row = Math.floor(x/pw), off = (row*0.37 % 1)*S, py = (y + off) % S, plank = Math.floor(py/plankLen);
    const id = row*7 + plank*13;
    const tone = .82 + ((id*9301+49297) % 233280)/233280 * .3;
    const gx = x - row*pw, gy = py - plank*plankLen;
    const grain = Math.sin((gy*.035 + fbm(gx*.02 + id, gy*.004, 4)*7)) * .5 + .5;
    const fine = fbm(gx*.4 + id*3, gy*.02, 2)*.5 + .5;
    const knot = Math.max(0, 1 - Math.hypot(gx - pw*.5 - Math.sin(id)*pw*.25, gy - plankLen*.5 - Math.cos(id)*80)/24);
    let r = 196*tone, gg = 150*tone, b = 104*tone;
    const k = .78 + grain*.16 + fine*.1 - knot*.35;
    r *= k; gg *= k; b *= k;
    const edge = (gx < 1.6 || gx > pw-1.6 || gy < 1.6 || gy > plankLen-1.6);
    if (edge) { r *= .45; gg *= .45; b *= .45; }
    const i = (y*S+x)*4; img.data[i] = r; img.data[i+1] = gg; img.data[i+2] = b; img.data[i+3] = 255;
    H[y*S+x] = edge ? 0 : .6 + grain*.08 + fine*.05;
  }
  g.putImageData(img,0,0);
  return { map:toTex(c,true,[2.2,2.2]), normalMap:toTex(normalFrom(H,S,3.2),false,[2.2,2.2]), roughnessMap:toTex(grayCanvas(H,S,v => v < .1 ? 240 : 120 + (1-v)*120),false,[2.2,2.2]) };
}
// plâtre
function plaster(){
  const S = 512, H = new Float32Array(S*S);
  for (let y=0;y<S;y++) for (let x=0;x<S;x++) H[y*S+x] = fbm(x*.03, y*.03, 5)*.6 + n2(x*.4, y*.4)*.15;
  const c = grayCanvas(H, S, v => 236 + v*14);
  return { map:toTex(c,true,[3,3]), normalMap:toTex(normalFrom(H,S,.9),false,[3,3]) };
}
// tissu (lin)
function fabric(base, S=512, scale=6){
  const H = new Float32Array(S*S), col = new THREE.Color(base);
  const c = cnv(S), g = c.getContext('2d'), img = g.createImageData(S,S);
  for (let y=0;y<S;y++) for (let x=0;x<S;x++){
    const w = (Math.sin(x*Math.PI*2/scale) * Math.sin(y*Math.PI*2/scale)) * .5;
    const slub = fbm(x*.08, y*.008, 3)*.5 + fbm(x*.008, y*.08, 3)*.5;
    const h = w*.4 + slub*.6; H[y*S+x] = h;
    const k = .92 + h*.12; const i = (y*S+x)*4;
    img.data[i] = col.r*255*k; img.data[i+1] = col.g*255*k; img.data[i+2] = col.b*255*k; img.data[i+3] = 255;
  }
  g.putImageData(img,0,0);
  return { map:toTex(c,true,[4,4]), normalMap:toTex(normalFrom(H,S,1.6),false,[4,4]) };
}
// tapis en laine
function rugTex(){
  const S = 512, c = cnv(S), g = c.getContext('2d'), img = g.createImageData(S,S), H = new Float32Array(S*S);
  for (let y=0;y<S;y++) for (let x=0;x<S;x++){
    const u = x/S, v = y/S, border = Math.min(u, 1-u, v, 1-v);
    const band = border < .06 ? 0 : border < .075 ? 1 : 2;
    const diag = (Math.floor((u+v)*14) % 2) && band === 2 && Math.abs(((u*14) % 1) - .5) < .08 ? 1 : 0;
    const pile = n2(x*.6, y*.6)*.5 + fbm(x*.02, y*.02, 3)*.5;
    let r, gg, b;
    if (band === 0) [r,gg,b] = [62,60,58]; else if (band === 1) [r,gg,b] = [226,219,205]; else [r,gg,b] = diag ? [70,66,62] : [214,206,190];
    const k = .9 + pile*.18; const i = (y*S+x)*4; img.data[i] = r*k; img.data[i+1] = gg*k; img.data[i+2] = b*k; img.data[i+3] = 255;
    H[y*S+x] = pile;
  }
  g.putImageData(img,0,0);
  return { map:toTex(c), normalMap:toTex(normalFrom(H,S,2.2),false) };
}

function duvet(){
  const w = BW + .1, d = BL*.72, geo = new THREE.BoxGeometry(w, .1, d, 64, 2, 64), p = geo.attributes.position;
  for (let i=0;i<p.count;i++){
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const ex = Math.min(1, (w/2 - Math.abs(x))/.12), ez = Math.min(1, (d/2 - Math.abs(z))/.12);
    const wr = fbm(x*2.2 + 3, z*2.2, 4)*.05 + fbm(x*7, z*7, 2)*.01;
    if (y > 0) y = .05 + wr*Math.min(ex,ez) - (1-Math.min(ex,ez))*.04;
    else y = -.05 - (Math.abs(x) > w/2 - .01 ? .16 + fbm(z*4, 1)*.04 : 0);
    if (Math.abs(x) > w/2 - .01) x += Math.sign(x)*(.02 + fbm(z*5, 2)*.015);
    if (z > d/2 - .01) { z += .02; if (y < 0) y = -.2; }
    p.setXYZ(i, x, y, z);
  }
  geo.computeVertexNormals();
  return mesh(geo, M.duvet, 0, .6, BL/2 - d/2 + .03, bed);
}

function furTex(){
  const S = 512, c = cnv(S), g = c.getContext('2d'), img = g.createImageData(S,S), H = new Float32Array(S*S);
  for (let y=0;y<S;y++) for (let x=0;x<S;x++){
    const stripe = Math.sin(x*.09 + fbm(x*.015, y*.015, 3)*5)*.5 + .5;
    const hair = n2(x*1.8, y*.25)*.5 + .5;
    const k = Math.pow(stripe, 2.2);
    const r = 150 - k*92, gg = 138 - k*86, b = 120 - k*78, h = .9 + hair*.2;
    const i = (y*S+x)*4; img.data[i] = r*h; img.data[i+1] = gg*h; img.data[i+2] = b*h; img.data[i+3] = 255;
    H[y*S+x] = hair;
  }
  g.putImageData(img,0,0);
  return { map:toTex(c,true,[2,2]), normalMap:toTex(normalFrom(H,S,2.5),false,[2,2]) };
}
